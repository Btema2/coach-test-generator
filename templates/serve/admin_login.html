{% extends "serve/base.html" %}

{% block title %}{{ t.admin_login_title }}: {{ brand }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="page page-narrow">
  <h1 class="page-title">{{ t.admin_login_title }}</h1>
  <p class="lead">{{ t.admin_login_text }}</p>
  <form class="panel panel-body form" method="post" action="{{ url_for('admin_login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
    <div class="field">
      <label for="password">{{ t.admin_password }}</label>
      <input class="input" id="password" name="password" type="password" autocomplete="current-password" required autofocus
             {% if error %}aria-invalid="true" aria-describedby="password-error"{% endif %}>
      {% if error %}<p class="field-error" id="password-error">{{ error }}</p>{% endif %}
    </div>
    <div><button class="btn btn-primary" type="submit">{{ t.admin_signin }}</button></div>
  </form>
</div>
{% endblock %}
