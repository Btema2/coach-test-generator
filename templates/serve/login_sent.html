{% extends "serve/base.html" %}

{% block title %}{{ t.login_sent_title }}: {{ brand }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block content %}
<div class="narrow">
  <h1>{{ t.login_sent_title }}</h1>
  <p>{{ fmt('login_sent_text', email=email) }}</p>
  <p>{{ t.login_sent_hint }}</p>
  <form method="post" action="{{ url_for('login', lang=lang) }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="email" value="{{ email }}">
    <button class="btn btn-secondary" type="submit">{{ t.login_resend }}</button>
  </form>
</div>
{% endblock %}
